name: Frozen audit candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze:
    name: Validate and freeze exact candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Run the complete release gate
        run: npm run check:ci

      - name: Validate the portable dependency graph
        run: |
          npm ci --ignore-scripts --omit=optional --no-audit --fund=false
          npm ls --all

      - name: Generate the release SBOM
        run: npm sbom --sbom-format cyclonedx --omit=optional > "$RUNNER_TEMP/01rx.cdx.json"

      - name: Freeze source, build, and SBOM hashes
        run: >-
          node scripts/audit-candidate-evidence.mjs
          --require-clean
          --artifact dist
          --artifact "$RUNNER_TEMP/01rx.cdx.json"
          --output "$RUNNER_TEMP/01rx-audit-candidate.json"

      - name: Retain the frozen evidence packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 01rx-audit-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/01rx-audit-candidate.json
            ${{ runner.temp }}/01rx.cdx.json
            dist
          if-no-files-found: error
          retention-days: 90
