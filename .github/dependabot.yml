version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - security-review

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '14:00'
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security-review
